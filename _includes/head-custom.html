<!-- beautiful-jekyll head 끝에 추가되는 hook. 한글 세리프 폰트 + 본문 톤 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
  body, .post-list, .post-content, p, li, blockquote {
    font-family: "Noto Serif KR", "Lora", Georgia, serif !important;
    font-weight: 400;
    line-height: 1.85;
    letter-spacing: -0.01em;
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: "Noto Serif KR", Georgia, serif !important;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  /* 본문 첫 글자 살짝 강조 — 잡지 느낌 */
  .post-content > p:first-of-type::first-letter {
    font-size: 1.6em;
    font-weight: 700;
    line-height: 1;
    color: #B45309;
    margin-right: 0.05em;
  }
  /* 글 헤더 이미지 더 풍부하게 — 약간 그림자 */
  .intro-header.big-img {
    box-shadow: inset 0 0 0 99999px rgba(61, 40, 23, 0.18);
  }
  /* 인용문 톤 */
  blockquote {
    border-left: 3px solid #B45309 !important;
    background: rgba(245, 158, 11, 0.06);
    padding: 0.6em 1em !important;
    color: #4A3527;
  }
  /* 링크 미세 — underline */
  .post-content a {
    text-decoration: underline;
    text-decoration-color: rgba(180, 83, 9, 0.4);
    text-underline-offset: 3px;
  }
</style>
