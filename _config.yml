# Site
title: "trend log"
description: "요즘 뜨고 있는 것들에 대한 짧은 기록"
author: haangman
lang: ko-KR
timezone: Asia/Seoul

# URL
url: "https://haangman.github.io"
baseurl: "/J-Blog"

# Google Search Console verification — GSC 등록 후 사용자가 토큰 채움.
# <meta name="google-site-verification" content="여기값"> 의 content 값만.
# jekyll-seo-tag 가 이 필드를 자동으로 meta 태그로 출력.
google_site_verification: "<meta name="google-site-verification" content="z9a9RSK9CLJnq-mDNm8beC5UemOO2czYXSdvQpHql4U" />"

# Build
theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:slug/

# Pagination
paginate: 10
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - vendor/
